name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar projeto
        run: |
          mkdir -p build
          if [ -f pede-ai-pdv.zip ]; then unzip -q pede-ai-pdv.zip -d build; else rsync -a --exclude build --exclude .git ./ build/; fi
          ls -la build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
        working-directory: build
      - run: npx cap add android
        working-directory: build
      - run: npx cap sync android
        working-directory: build
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: build/android
      - uses: actions/upload-artifact@v4
        with:
          name: pede-ai-pdv-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
