name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar projeto
        run: |
          ls -la
          mkdir -p tmp appbuild
          for z in *.zip; do if [ -f "$z" ]; then unzip -q -o "$z" -d tmp; fi; done
          P=$(find tmp -name package.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$P" ]; then P=./package.json; fi
          if [ ! -f "$P" ]; then echo "ERRO package.json nao encontrado"; exit 1; fi
          rsync -a --exclude tmp --exclude appbuild --exclude .git "$(dirname "$P")"/ appbuild/
          ls -la appbuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar
        working-directory: appbuild
        run: npm install
      - name: Adicionar Android
        working-directory: appbuild
        run: npx cap add android
      - name: Sincronizar
        working-directory: appbuild
        run: npx cap sync android
      - name: Compilar APK
        working-directory: appbuild/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pede-ai-pdv-apk
          path: appbuild/android/app/build/outputs/apk/debug/app-debug.apk
